defaults:
  - ../common.yaml

training:
  optimizer_name: muon
  training_stage: pretrain
  batch_size: 2
  num_workers: 2

gpu:
  distributed: False

model:
  
  llm_name: Qwen/Qwen3.5-0.8B-Base
  llm_tokenizer_name: Qwen/Qwen3.5-0.8B-Base
  
  encoder_name: siglep
  encoder_tokenizer_name: null

data:
  data_names: # yaml list
    - ELM-Research/pretrain-stage1
    - ELM-Research/pretrain-stage2
  split_names: # corresponding to data_names
    - fold1_train
    - fold1_train

  data_subset: null
