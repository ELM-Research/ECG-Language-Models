defaults:
  - ../common.yaml

training:
  optimizer: muon
  training_stage: pretrain
  batch_size: 2
  num_workers: 2

gpu:
  distributed: True

model:
  language_model: Qwen/Qwen3.5-0.8B-Base

data:
  data_names: # yaml list
    - ELM-Research/pretrain-stage1
    - ELM-Research/pretrain-stage2
  split_names: # corresponding to data_names
    - fold1_train
    - fold1_train
