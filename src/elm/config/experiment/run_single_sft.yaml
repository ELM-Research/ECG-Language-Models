defaults:
  - ../common.yaml

training:
  optimizer_name: muon
  training_stage: sft
  batch_size: 2
  num_workers: 0

gpu:
  distributed: False

model:
  elm_name: orah
  elm_checkpoint: null
  
  llm:
    pretrained: true
    peft: null
    lora_rank: 16
    lora_alpha = 32
    llm_name: Qwen/Qwen3.5-0.8B-Base
    llm_tokenizer_name: Qwen/Qwen3.5-0.8B-Base
    truncation_length: 1024
    attn_implementation: sdpa
    gradient_checkpointing: true
    # llm_name: Qwen/Qwen3.5-0.8B
    # llm_tokenizer_name: Qwen/Qwen3.5-0.8B
    # llm_name: Qwen/Qwen3-0.6B
    # llm_tokenizer_name: Qwen/Qwen3-0.6B
  
  connector:
    connector_name: mlp 

  encoder:
    encoder_name: siglep
    encoder_tokenizer_name: null
    encoder_checkpoint: null

  ecg_tokens:
    mode: static
    num_ecg_tokens: 100

data:
  data_names: # yaml list
    - ELM-Research/sft-stage1-noaug
  
  split_names: # corresponding to data_names
    - fold1_train

  data_subset: null
