defaults:
  - ../common.yaml

training:
  training_stage: pretrain
  batch_size: 12
  gradient_accumulation_steps: 1
  epochs: 3

optimizer:
  learning_rate: 2.0e-4

model:
  checkpoint: null
  trainable: [projector, language_model]

data:
  data_names: [ELM-Research/pretrain-stage2]
  split_names: [fold1_train]
