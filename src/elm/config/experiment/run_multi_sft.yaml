defaults:
  - ../common.yaml

training:
  training_stage: sft
  batch_size: 2
  num_workers: 2
  epochs: 1

optimizer:
  name: muon
  learning_rate: 1.0e-3
  weight_decay: 0.05

gpu:
  strategy: fsdp2

data:
  data_names: # yaml list
    - ELM-Research/sft-stage1-noaug
  split_names: # corresponding to data_names
    - fold1_train
